spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/prepflow;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

server.port=8080

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-32-character-minimum-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
