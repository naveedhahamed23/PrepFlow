spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/prepflow}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}

server.port=${SERVER_PORT:8081}

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-32-character-minimum-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ── Gemini AI ─────────────────────────────────────────────────────────────────
# Set GEMINI_API_KEY in your environment (never commit real keys).
# GEMINI_MODEL defaults to gemini-2.0-flash-lite if not set.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
